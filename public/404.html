<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面没找到 · 基沃托斯作战本部</title>
    <style>
      :root {
        --bg: #f2f7fc;
        --surface: #ffffff;
        --border: #c9ddf0;
        --text: #123a5c;
        --text-secondary: #44688a;
        --accent: #3d9be9;
        --accent-soft: #cbe6fb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: 'M PLUS Rounded 1c', 'PingFang SC', 'Microsoft YaHei UI', sans-serif;
        line-height: 1.75;
      }
      .box {
        max-width: 460px;
        text-align: center;
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 22px;
        padding: 2rem 1.5rem;
      }
      .halo {
        width: 96px;
        height: 96px;
        margin: 0 auto 1rem;
        border-radius: 50%;
        border: 3px solid var(--accent);
        box-shadow: 0 0 22px rgba(61, 155, 233, 0.35);
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.25rem; }
      p { margin: 0 0 1.25rem; color: var(--text-secondary); font-size: 0.9375rem; }
      a {
        display: inline-block;
        min-height: 44px;
        padding: 0 1.25rem;
        line-height: 44px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover { background: #2e8bd9; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="halo"></div>
      <h1>这个页面不存在</h1>
      <p>链接可能过期了，或者地址打错了。回到作战本部继续吧。</p>
      <a href="./">回到作战本部</a>
    </div>
    <script>
      // GitHub Pages 对不存在的路径会返回这个页面，
      // 这里顺手把根路径的 hash 带上，用户点回来就能进应用。
      if (!location.hash) location.replace('./#home')
    </script>
  </body>
</html>
